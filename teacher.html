<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кабинет преподавателя</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap">
<style>
:root{
  --bg:#f4f6f8; --panel:#ffffff; --ink:#16202b; --muted:#5b6876; --line:#d8dee5; --grid:#e8ecf0;
  --accent:#1f5fbf; --accent-soft:#e3ecfa; --good:#1d7a4c; --good-soft:#e1f2e8; --warn:#8a5a00; --warn-soft:#fff3d6; --bad:#b4322e; --bad-soft:#fbe6e4;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --panel:#18202a; --ink:#e6ebf0; --muted:#97a3b0; --line:#2c3743; --grid:#222c37;
  --accent:#6ea2ff; --accent-soft:#1c2c48; --good:#5cc98f; --good-soft:#163526; --warn:#e3a93a; --warn-soft:#3a2d12; --bad:#f07b72; --bad-soft:#3e1e1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --panel:#18202a; --ink:#e6ebf0; --muted:#97a3b0; --line:#2c3743; --grid:#222c37;
  --accent:#6ea2ff; --accent-soft:#1c2c48; --good:#5cc98f; --good-soft:#163526; --warn:#e3a93a; --warn-soft:#3a2d12; --bad:#f07b72; --bad-soft:#3e1e1d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1400px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px;margin-bottom:16px}
h1{font-family:var(--f-display);font-size:28px;line-height:1.1;margin:0}
h2{font-family:var(--f-display);font-size:19px;margin:0 0 10px}
.sub{color:var(--muted);font-size:13.5px;margin:4px 0 0}
.small{font-size:13px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:#fff;font:600 13px var(--f-body);padding:8px 12px;border-radius:5px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--accent)}.btn:disabled{opacity:.5;cursor:default}
.linkbtn{appearance:none;border:0;background:none;color:var(--accent);font:inherit;padding:0;cursor:pointer;text-decoration:underline}
input,select,textarea{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:14px var(--f-body)}
.fld{display:grid;gap:3px;margin:0 0 10px;font-size:13px;color:var(--muted)}
.acct{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{appearance:none;border:0;border-right:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 13.5px var(--f-body);padding:8px 12px;cursor:pointer}
.seg button:last-child{border-right:0}.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.cnt{font:600 11px var(--f-mono);background:var(--bad);color:#fff;border-radius:999px;padding:1px 6px;margin-left:4px}
.tbl{overflow:auto;max-height:calc(100vh - 210px);border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--grid);text-align:left;white-space:nowrap}
thead th{position:sticky;top:0;background:var(--panel);z-index:2;font:600 11.5px var(--f-mono);letter-spacing:.03em;color:var(--muted);text-transform:uppercase;cursor:pointer;border-bottom:1px solid var(--line)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--accent-soft)}
td.stu{position:sticky;left:0;background:var(--panel);z-index:1;font-weight:600}tbody tr:hover td.stu{background:var(--accent-soft)}
thead th.stu{left:0;z-index:3}
.c{display:inline-block;min-width:44px;text-align:center;border-radius:4px;padding:1px 5px;font:600 12.5px var(--f-mono);cursor:pointer}
.c5{background:var(--good-soft);color:var(--good)}.c4{background:var(--accent-soft);color:var(--accent)}.c3{background:var(--warn-soft);color:var(--warn)}.c2{background:var(--bad-soft);color:var(--bad)}
.c0{color:var(--muted)}.att{font-size:10.5px;color:var(--muted);margin-left:2px}
.pill{font:600 11px var(--f-mono);border-radius:999px;padding:1px 7px;background:var(--bg);border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 14px}
.stat{background:var(--bg);border-radius:6px;padding:8px 12px}.stat b{display:block;font:700 22px var(--f-display)}
.sb{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0}
.sb summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.sb summary b{font-weight:600}
.grade{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.grade textarea{flex:1 1 260px;min-height:76px}
.open-a{white-space:pre-wrap;background:var(--bg);border-radius:6px;padding:10px 12px;margin:6px 0}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:18px 20px;width:min(980px,calc(100vw - 24px));max-height:calc(100vh - 30px)}
dialog::backdrop{background:rgba(10,20,40,.45)}
.dx{float:right}
.ok{color:var(--good)}.err{color:var(--bad)}
.lvbar{display:grid;grid-template-columns:110px minmax(0,1fr) 46px;gap:8px;align-items:center;font-size:12.5px;margin:3px 0}
.track{height:10px;background:var(--bg);border:1px solid var(--line);border-radius:5px;overflow:hidden}.track span{display:block;height:100%;background:var(--accent)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.aibox{background:var(--accent-soft);border-radius:6px;padding:8px 12px;margin:10px 0 0;font-size:13.5px}
.aibox ol{margin:4px 0;padding-left:20px}.aibox .warn{color:var(--warn);font-weight:600}
.aiwarn{color:var(--warn);font-weight:600}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:16px;margin-bottom:16px}.dgrid .panel{margin:0}
@media (max-width:520px){.dgrid{grid-template-columns:1fr}}
.hb{display:grid;grid-template-columns:minmax(90px,210px) minmax(0,1fr) minmax(70px,auto);gap:8px;align-items:center;font-size:13px;margin:5px 0}
.hb .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .val{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}.hb .val b{color:var(--ink)}
.hb .tr{height:14px;background:var(--grid);border-radius:0 4px 4px 0;position:relative}.hb .tr span{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.hb .tr i{position:absolute;top:-3px;bottom:-3px;width:0;border-left:1px dashed var(--muted)}
.hb.g5 .tr span{background:var(--good)}.hb.g4 .tr span{background:var(--accent)}.hb.g3 .tr span{background:var(--warn)}.hb.g2 .tr span{background:var(--bad)}.hb.g0 .tr span{background:var(--muted)}
.wk{display:flex;align-items:flex-end;gap:2px;height:150px;border-bottom:1px solid var(--line);padding-top:16px}
.wk div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font:11px var(--f-mono);color:var(--muted)}
.wk div span{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:4px 4px 0 0;min-height:1px}.wk div:hover span{opacity:.75}
.wkx{display:flex;gap:2px}.wkx span{flex:1;text-align:center;font:10.5px var(--f-mono);color:var(--muted);padding-top:3px}
.risk{display:inline-block;font:600 11px var(--f-body);border-radius:999px;padding:1px 7px;margin:1px 2px;background:var(--warn-soft);color:var(--warn)}.risk.hi{background:var(--bad-soft);color:var(--bad)}
@media (max-width:700px){h1{font-size:23px}.tbl{max-height:none}}
</style>
<script src="cloud-config.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Кабинет преподавателя</h1><p class="sub" id="sub">Сводка по студентам, тестам и отчётам</p></div>
    <div class="acct" id="acct"><a class="btn ghost" href="index.html">← Учебник</a></div>
  </header>
  <div id="app"><div class="panel empty">Загрузка…</div></div>
</div>
<dialog id="dlg"></dialog>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CFG = (window.ISU_CLOUD && ISU_CLOUD.url && ISU_CLOUD.key) ? ISU_CLOUD : null;
/* ---------- курсы: каждый учебник пишет в общую базу, кабинет показывает выбранный ---------- */
const COURSES = {
  isu: {name:'Интеллектуальные системы управления', short:'ИСУ', book:'index.html'},
  kuod: {name:'Корпоративное управление и организационный дизайн', short:'КУОД', book:'https://dkanetova76-hue.github.io/kuod-trainer/'},
  ct: {name:'Цифровые технологии', short:'ЦТ', book:'https://dkanetova76-hue.github.io/ct-trainer/'}
};
let COURSE = localStorage.getItem('isu-t-course') || 'isu', HAS_COURSE = true;
const ISU_LEC = ['Основы ИСУ','Архитектура ИСУ','Представление знаний','Экспертные системы','Нечёткие множества','Мамдани и Сугено','Машинное обучение','Прогноз и аномалии','Нейронные сети','СППР, IoT, двойники'];
const ISU_PRN = ['Контур управления','Данные и контракт','База знаний','Экспертная система','Функции принадлежности','Система Мамдани','Регулятор в контуре','Подготовка данных МО','Регрессия и прогноз','Классификация состояний','Обнаружение аномалий','Нейросеть MLP','СППР','Итоговый проект'];
const KU_LEC = ['Основы корпоративного управления','Модели КУ и стратегические решения','Стратегия и архитектура предприятия','КУ в цифровой трансформации','Организационный дизайн','Оргструктуры и полномочия','Процессный подход','Цифровые технологии и ИИ','Культура и изменения','Оценка эффективности'];
const KU_PZ = ['Теории КУ','Национальное и международное КУ','Стратегия и архитектура','Цифровая зрелость','Оргструктура и RACI','Сравнение оргмоделей','Бизнес-процессы AS-IS/TO-BE','ИИ в оргпроектировании','Управление изменениями','Комплексная оценка','Риски и внутренний контроль','IT-инвестиции и портфель','Данные, ИБ и ИИ','Итоговый практикум'];
const KU_SRM = ['Теории и модели КУ','Национальная и международная компания','Корпоративная стратегия','Цифровая зрелость','Оргструктура и полномочия','Оргмодели','Бизнес-процесс','Обоснование ИИ','Готовность к изменениям','Оценка эффективности КУ','Риски, данные, инвестиции','Итоговый проект'];
const KU_TESTS = [['B1','Уровень 1 · Запоминание','Б1'],['B2','Уровень 2 · Понимание','Б2'],['B3','Уровень 3 · Применение','Б3'],['B4','Уровень 4 · Анализ','Б4'],['B5','Уровень 5 · Оценка','Б5'],['M1','Модуль М1','М1'],['M2','Модуль М2','М2'],['M3','Модуль М3','М3'],['FIN','Рубежный контроль','Рубеж'],['ALL','Весь банк (60)','Все']];
const CT_LEC = ['Введение в ЦТ','Компьютерные технологии','Работа с данными','Базы данных и SQL','Анализ и визуализация','Интернет-технологии','Бизнес-тренды','Проектирование предприятий','Цифровая безопасность','Облачные технологии','Машинное обучение','Интернет вещей','VR/AR','Цифровой маркетинг','Цифровая трансформация'];
const CT_PZ = ['Бизнес-тренды','Эволюция ИТ','КИС','Архитектура предприятия','IoT','СППР и Data Mining','Мультиагентные системы','Машинное обучение','VR/AR','Цифровой маркетинг','Цифровая трансформация'];
const CT_SRS = ['Бизнес-процесс','Утечка данных','Переход в облако','Прогноз продаж','Умное освещение','AR в рознице','Маркетинг кафе','Трансформация логистики'];
const CT_TESTS = [...KU_TESTS.filter(t => t[0] !== 'M3').map(t => t[0] === 'M1' ? ['M1','Модуль 1 (тест)','М1'] : t[0] === 'M2' ? ['M2','Модуль 2 (самопроверка)','М2'] : t[0] === 'FIN' ? ['FIN','Итоговый экзамен','Экз'] : t[0] === 'ALL' ? ['ALL','Весь банк','Все'] : t), ...CT_LEC.map((n, i) => ['L' + (i + 1), `Лекция ${i + 1}. ${n}`, 'Л' + (i + 1)])];
const CC = {
  isu: {LEC: ISU_LEC, PRACT: ISU_PRN.length, prLabel:'Практики',
    TESTS: [...ISU_LEC.map((n, i) => ['L' + (i + 1), `Лекция ${i + 1}. ${n}`, 'Л' + (i + 1)]), ['FT', 'Итоговый тест: теория', 'Итог Т'], ...ISU_PRN.map((n, i) => ['P' + (i + 1), `ПР-${i + 1}. ${n}`, 'ПР' + (i + 1)]), ['FP', 'Итоговый тест: практика', 'Итог П']],
    REPS: ISU_PRN.map((n, i) => ['PR' + (i + 1), `ПР-${i + 1}. ${n}`, 'ПР' + (i + 1)])},
  kuod: {LEC: KU_LEC, PRACT: KU_PZ.length, prLabel:'Практ. занятия',
    TESTS: KU_TESTS,
    REPS: [...KU_PZ.map((n, i) => ['PZ' + (i + 1), `ПЗ-${i + 1}. ${n}`, 'ПЗ' + (i + 1)]), ...KU_SRM.map((n, i) => ['SRM' + (i + 1), `СРМ-${i + 1}. ${n}`, 'С' + (i + 1)])]},
  ct: {LEC: CT_LEC, PRACT: CT_PZ.length, prLabel:'Практ. занятия',
    TESTS: CT_TESTS,
    REPS: [...CT_PZ.map((n, i) => ['PZ' + (i + 1), `ПЗ-${i + 1}. ${n}`, 'ПЗ' + (i + 1)]), ...CT_SRS.map((n, i) => ['SRS' + (i + 1), `СРС-${i + 1}. ${n}`, 'С' + (i + 1)])]}
};
const C = () => CC[COURSE] || CC.isu;
let LEC = ISU_LEC, PRN = ISU_PRN;
const TESTIDS_ = () => C().TESTS.map(t => t[0]);
const TNAME = id => { const t = C().TESTS.find(x => x[0] === id) || C().REPS.find(x => x[0] === id); return t ? t[1] : id; };
const isKu = s => !!(s && s.data && s.data.course === 'kuod') || /^(PZ|SRM)\d+$/.test((s && s.ref) || '') || /^(B\d|M\d|FIN|ALL)$/.test((s && s.ref) || '');
const BLOOM = ['', 'Запоминание', 'Понимание', 'Применение', 'Анализ', 'Оценивание', 'Создание'];
const gradeOf = p => p == null ? 0 : p >= 85 ? 5 : p >= 70 ? 4 : p >= 55 ? 3 : 2;
const dt = s => s ? new Date(s).toLocaleString('ru-RU', {dateStyle:'short', timeStyle:'short'}) : '—';
const fmt = (v, d = 1) => v == null ? '—' : (Math.round(v * 10 ** d) / 10 ** d).toLocaleString('ru-RU');
const SB_URLS = ['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js', 'https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'];
let SB = null, ME = null, GROUPS = [], GRP = localStorage.getItem('isu-t-grp') || '', VIEW = localStorage.getItem('isu-t-view') || 'over', ACT = [], BEST = [], QUEUE = [], SORT = {k:'fio', d:1};

function lib(){
  if (window.__SB_MOCK) return Promise.resolve(window.__SB_MOCK);
  return new Promise((res, rej) => { let i = 0; const next = () => { if (i >= SB_URLS.length) return rej(new Error('lib')); const s = document.createElement('script'); s.src = SB_URLS[i++]; s.onload = () => window.supabase ? res(window.supabase) : next(); s.onerror = next; document.head.appendChild(s); }; next(); });
}
async function init(){
  if (!CFG){ $('#app').innerHTML = '<div class="panel"><h2>База данных не подключена</h2><p>Откройте файл <b>cloud-config.js</b> в репозитории и впишите адрес проекта Supabase и ключ anon public. Подробно — в инструкции по подключению.</p></div>'; return; }
  try { SB = (await lib()).createClient(CFG.url, CFG.key, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}}); }
  catch(e){ $('#app').innerHTML = '<div class="panel err">Не удалось загрузить библиотеку Supabase. Проверьте интернет.</div>'; return; }
  SB.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') newPass(); });
  const {data} = await SB.auth.getSession();
  if (data && data.session) await afterLogin(data.session.user); else loginForm();
}
function loginForm(msg){
  $('#acct').innerHTML = `<a class="btn ghost" href="${COURSES[COURSE].book}">← Учебник</a>`;
  $('#app').innerHTML = `<div class="panel" style="max-width:440px"><h2>Вход преподавателя</h2>
    <label class="fld">Электронная почта<input id="l-email" type="email" autocomplete="email"></label>
    <label class="fld">Пароль<input id="l-pass" type="password" autocomplete="current-password"></label>
    <div class="bar"><button class="btn" id="l-go">Войти</button><button class="linkbtn" id="l-reset">Забыли пароль?</button></div>
    <p id="l-msg" class="${msg ? 'err' : ''}">${esc(msg || '')}</p>
    <p class="small">Первый вход: зарегистрируйтесь в учебнике (кнопка «Регистрация») с <b>кодом преподавателя</b>, который показал SQL-скрипт при настройке базы.</p></div>`;
  const go = async () => { const {data, error} = await SB.auth.signInWithPassword({email: $('#l-email').value.trim(), password: $('#l-pass').value}); if (error){ $('#l-msg').className = 'err'; $('#l-msg').textContent = /Invalid/.test(error.message) ? 'Неверная почта или пароль.' : error.message; } else afterLogin(data.user); };
  $('#l-go').onclick = go; $('#l-pass').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('#l-reset').onclick = async () => { const em = $('#l-email').value.trim(); if (!em){ $('#l-msg').textContent = 'Впишите почту.'; return; } const {error} = await SB.auth.resetPasswordForEmail(em, {redirectTo: location.href.split('#')[0]}); $('#l-msg').className = error ? 'err' : 'ok'; $('#l-msg').textContent = error ? error.message : 'Ссылка для смены пароля отправлена на почту.'; };
}
function newPass(){
  const d = $('#dlg'); d.innerHTML = `<h2>Новый пароль</h2><label class="fld">Пароль (не меньше 6 знаков)<input id="np" type="password" autocomplete="new-password"></label><button class="btn" id="np-go">Сохранить</button> <span id="np-m"></span>`;
  d.showModal(); $('#np-go').onclick = async () => { const {error} = await SB.auth.updateUser({password: $('#np').value}); $('#np-m').className = error ? 'err' : 'ok'; $('#np-m').textContent = error ? error.message : 'Сохранено.'; if (!error) setTimeout(() => d.close(), 800); };
}
async function afterLogin(user){
  const {data} = await SB.from('profiles').select('id,fio,grp,role').eq('id', user.id).single();
  if (!data || data.role !== 'teacher'){ await SB.auth.signOut(); loginForm('У этой учётной записи нет прав преподавателя.'); return; }
  ME = data;
  $('#acct').innerHTML = `<span><b>${esc(ME.fio)}</b></span><a class="btn ghost" id="booklink" href="${COURSES[COURSE].book}">← Учебник</a><button class="btn ghost" id="logout">Выйти</button>`;
  $('#logout').onclick = async () => { await SB.auth.signOut(); ME = null; loginForm(); };
  $('#app').innerHTML = `<div class="bar">
      <div class="seg" id="courses" aria-label="Дисциплина">${Object.entries(COURSES).map(([k, c]) => `<button data-c="${k}" aria-pressed="${k === COURSE}" title="${esc(c.name)}">${c.short}</button>`).join('')}</div>

function aiBox(x, d){
  if (!d) return `<div class="aibox">${AI.err[x.id] ? `<span class="err">ИИ: ${esc(AI.err[x.id])}</span><br>` : ''}<button class="btn ghost" data-ai1="${x.id}" ${AI.busy ? 'disabled' : ''}>Проверить с ИИ</button> <span class="small">черновые баллы по критериям, оценка и комментарий</span></div>`;
  return `<div class="aibox"><b>Черновик ИИ:</b> ${d.sum} из ${d.max} баллов по критериям → предлагаемая оценка <b>${d.grade}</b> <span class="small">(итог ${d.pct} %${x.kind === 'test' ? `: автопроверка ${Math.round((1 - W_CREATIVE) * 100)} % + творческое ${Math.round(W_CREATIVE * 100)} %` : ''})</span>
    ${d.flags ? `<div class="warn">⚠ ${esc(d.flags)}</div>` : ''}
    ${d.crit.map(L => `<ol>${L.map(r => `<li>${esc(r.c)} — <b>${r.p}</b>${r.note ? ` <span class="small">· ${esc(r.note)}</span>` : ''}</li>`).join('')}</ol>`).join('')}
    <span class="small">Оценка и комментарий ниже уже подставлены: исправьте при необходимости и нажмите «Сохранить». ${esc(d.model)} · <button class="linkbtn" data-ai1="${x.id}">перепроверить</button></span></div>`;
}
function jszip(){
  if (window.JSZip) return Promise.resolve(window.JSZip);
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'; s.onload = () => res(window.JSZip); s.onerror = () => rej(new Error('не загрузилась библиотека чтения DOCX')); document.head.appendChild(s); });
}
async function docxText(path){
  const {data, error} = await SB.storage.from('works').download(path);
  if (error) throw new Error('файл отчёта: ' + error.message);
  const zip = await (await jszip()).loadAsync(data), f = zip.file('word/document.xml');
  if (!f) throw new Error('файл отчёта не похож на DOCX');
  const xml = await f.async('string');
  return xml.replace(/<\/w:p>\s*<\/w:tc>/g, '</w:tc>').replace(/<w:tab\/>/g, '\t').replace(/<w:br\/>/g, '\n').replace(/<\/w:p>/g, '\n').replace(/<\/w:tc>/g, ' | ').replace(/<\/w:tr>/g, '\n').replace(/<[^>]+>/g, '')
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim().slice(0, 24000);
}
async function aiTasks(n){
  if (n.kind === 'test') return (n.open || []).map(o => ({q: o.q, crit: o.crit || [], a: o.a || ''}));
  const text = n.file_path ? await docxText(n.file_path) : '';
  return [{q: `Отчёт по работе «${n.title}». Заполнено ${n.score} % обязательных частей формы.`, crit: REP_CRIT, a: text}];
}
const aiCourse = n => (COURSES[n.course] || COURSES[COURSE]).name;
const aiWork = (n, tasks) => `Работа: ${n.kind === 'test' ? 'творческое задание теста' : 'отчёт'} «${n.title}»\n` + JSON.stringify(tasks.map((t, i) => ({n: i + 1, задание: t.q, критерии: t.crit, ответ_студента: t.a})), null, 1);
async function aiCall(system, user, max = 2000){
  const r = await fetch('https://api.anthropic.com/v1/messages', {method: 'POST',
    headers: {'content-type': 'application/json', 'x-api-key': AI.key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'},
    body: JSON.stringify({model: AI.model, max_tokens: max, system, messages: [{role: 'user', content: user}]})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j.error && j.error.message) || 'HTTP ' + r.status);
  return (j.content || []).map(c => c.text || '').join('');
}
function aiParse(t, arr){
  const a = t.indexOf(arr ? '[' : '{'), b = t.lastIndexOf(arr ? ']' : '}');
  if (a < 0 || b < a) throw new Error('ИИ ответил не в формате JSON');
  try { return JSON.parse(t.slice(a, b + 1)); } catch(e){ throw new Error('не удалось разобрать ответ ИИ'); }
}
function aiDraft(n, tasks, res){
  const crit = tasks.map((t, i) => (t.crit || []).map((c, j) => {
    const r = (((res.tasks || [])[i] || {}).crit || [])[j] || {}; let p = Math.round(+r.p);
    if (!(p >= 0)) p = 0; if (p > 2) p = 2; if (!String(t.a || '').trim()) p = 0;
    return {c, p, note: String(r.note || '')}; }));
  const all = crit.flat(), sum = all.reduce((s, r) => s + r.p, 0), max = all.length * 2, cp = max ? sum / max : 0;
  const ap = n.kind !== 'test' ? null : n.auto ? (+n.got || 0) / +n.auto : n.score != null ? +n.score / 100 : null;
  const pct = ap == null ? cp : (1 - W_CREATIVE) * ap + W_CREATIVE * cp;
  return {crit, sum, max, pct: Math.round(pct * 100), grade: gradeOf(pct * 100), comment: String(res.comment || '').trim(), flags: String(res.flags || '').trim(), model: res._model || AI.model, at: Date.now()};
}
function aiRefresh(final){
  if (VIEW === 'queue' && $('#view')) renderQueue();
  if (final && CARD && $('#dlg').open) openStudent(...CARD);
}
async function aiRun(list){
  if (AI.busy || !list.length) return;
  if (!AI.key){ aiSettings('Чтобы ИИ проверял работы сам, впишите ключ API. Без ключа можно воспользоваться ручным режимом ниже.'); return; }
  AI.busy = true; AI.stop = false; let i = 0, ok = 0, bad = 0, fatal = '';
  AI.msg = `Проверяю 0 из ${list.length}…`; aiRefresh();
  const worker = async () => { while (!AI.stop && i < list.length){ const x = list[i++];
    try { const n = nx(x), tasks = await aiTasks(n); const txt = await aiCall(`Ты — ассистент преподавателя вуза, дисциплина «${aiCourse(n)}». ` + AI_RULES + '\nОтветь ТОЛЬКО JSON без пояснений:\n{"tasks":[{"crit":[{"p":2,"note":"..."}]}],"comment":"...","flags":""}', aiWork(n, tasks));
      AI.drafts[x.id] = aiDraft(n, tasks, aiParse(txt)); delete AI.err[x.id]; AI.save(); ok++; }
    catch(e){ AI.err[x.id] = e.message || String(e); bad++; if (/api.key|x-api-key|authentication|credit|balance|billing|permission|model/i.test(AI.err[x.id])){ fatal = AI.err[x.id]; AI.stop = true; } }
    AI.msg = `Проверено ${ok + bad} из ${list.length}…`; aiRefresh(); } };
  await Promise.all([worker(), worker(), worker()]);
  AI.busy = false; AI.msg = fatal ? 'Остановлено: ' + fatal : `Готово: черновиков ${ok}${bad ? `, ошибок ${bad} (наведите на «ошибка»)` : ''}${AI.stop ? ', остановлено' : ''}.`; aiRefresh(true);
}
async function aiConfirm(id){
  const d = AI.drafts[id]; if (!d) return false;
  const {error} = await SB.from('submissions').update({teacher_grade: d.grade, teacher_comment: aiComment(d), checked_at: new Date().toISOString()}).eq('id', id);
  if (error){ AI.err[id] = error.message; delete AI.drafts[id]; return false; }
  delete AI.drafts[id]; AI.save(); return true;
}
async function refreshQueue(){
  const [b, q] = await Promise.all([SB.rpc('group_best', {p_grp: GRP || null}), loadQueue()]);
  const cg = new Set(GROUPS.map(g => g.name)); BEST = b.data || BEST; QUEUE = q.filter(x => cg.has(x.profiles.grp));
  $('#qcnt').hidden = !QUEUE.length; $('#qcnt').textContent = QUEUE.length; render();
}
function aiSettings(msg){
  const d = $('#dlg'); CARD = null;
  d.innerHTML = `<button class="linkbtn dx" data-dx>✕ закрыть</button><h2>Проверка с помощью ИИ</h2>
    ${typeof msg === 'string' ? `<p class="aiwarn">${esc(msg)}</p>` : ''}
    <p class="small">ИИ (Claude) читает ответ студента, ставит по каждому критерию 0–2 балла, предлагает оценку и комментарий. Это только черновик: студент увидит оценку после того, как вы нажмёте «Подтвердить» или «Сохранить».</p>
    <h3>Автоматический режим (ключ API)</h3>
    <label class="fld">Ключ Claude API (начинается с sk-ant-)<input id="ai-key" type="password" autocomplete="off" value="${esc(AI.key)}" placeholder="sk-ant-…"></label>
    <label class="fld">Модель<select id="ai-model">${AI_MODELS.map(([v, t]) => `<option value="${v}" ${v === AI.model ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
    <div class="bar"><button class="btn" id="ai-ksave">Сохранить</button><button class="btn ghost" id="ai-ktest">Проверить ключ</button><button class="linkbtn" id="ai-kdel">Удалить ключ</button><span id="ai-km" class="small"></span></div>
    <p class="small">Ключ создаётся на console.anthropic.com → API Keys; оплата — по факту использования. Ключ хранится только в этом браузере и отправляется только в Anthropic. Не сохраняйте его на чужом или общем компьютере; в консоли можно задать месячный лимит расходов.</p>
    <h3>Ручной режим (без ключа)</h3>
    <p class="small">1) Нажмите «Скопировать запрос» — в буфер попадут до 10 непроверенных работ. 2) Вставьте запрос в чат с Claude. 3) Скопируйте его ответ целиком сюда и нажмите «Принять ответ».</p>
    <div class="bar"><button class="btn ghost" id="ai-mcopy">Скопировать запрос</button><span id="ai-mm" class="small"></span></div>
    <textarea id="ai-mans" style="width:100%;min-height:110px" placeholder="Сюда — ответ ИИ (JSON)"></textarea>
    <div class="bar" style="margin-top:8px"><button class="btn" id="ai-mok">Принять ответ</button><span id="ai-mr" class="small"></span></div>`;
  if (!d.open) d.showModal();
  const km = (t, ok) => { $('#ai-km').className = ok ? 'ok small' : 'err small'; $('#ai-km').textContent = t; };
  const put = () => { localStorage.setItem('isu-ai-key', $('#ai-key').value.trim()); localStorage.setItem('isu-ai-model', $('#ai-model').value); };
  $('#ai-ksave').onclick = () => { put(); km('Сохранено.', true); };
  $('#ai-kdel').onclick = () => { localStorage.removeItem('isu-ai-key'); $('#ai-key').value = ''; km('Ключ удалён из браузера.', true); };
  $('#ai-ktest').onclick = async () => { put(); km('Проверяю…', true); try { await aiCall('Ответь одним словом.', 'Скажи «готово».', 10); km('Ключ работает.', true); } catch(e){ km(e.message, false); } };
  $('#ai-mcopy').onclick = async () => {
    const L = QUEUE.filter(s => !AI.drafts[s.id]).slice(0, 10); if (!L.length){ $('#ai-mm').textContent = 'Нет работ без черновика.'; return; }
    $('#ai-mm').textContent = 'Готовлю запрос…'; AI.manual = {}; const parts = [];
    for (const x of L){ try { const n = nx(x), tasks = await aiTasks(n); AI.manual[x.id] = {n, tasks}; parts.push(`### Работа id=${x.id}, дисциплина «${aiCourse(n)}»\n` + aiWork(n, tasks)); } catch(e){ AI.err[x.id] = e.message; } }
    const txt = `Ты — ассистент преподавателя вуза. ${AI_RULES}\nПроверь каждую работу отдельно. Ответь ТОЛЬКО JSON-массивом без пояснений, по одному объекту на работу:\n[{"id":123,"tasks":[{"crit":[{"p":2,"note":"..."}]}],"comment":"...","flags":""}]\n\n` + parts.join('\n\n');
    try { await navigator.clipboard.writeText(txt); $('#ai-mm').className = 'ok small'; $('#ai-mm').textContent = `Скопировано: ${parts.length} работ. Вставьте в чат с Claude.`; }
    catch(e){ $('#ai-mans').value = txt; $('#ai-mm').textContent = 'Буфер недоступен — запрос в поле ниже, скопируйте его вручную (Ctrl+A, Ctrl+C), затем очистите поле.'; }
  };
  $('#ai-mok').onclick = () => { const r = $('#ai-mr');
    try { const arr = aiParse($('#ai-mans').value, true); let k = 0;
      for (const o of arr){ const m = AI.manual[+o.id]; if (!m) continue; AI.drafts[+o.id] = aiDraft(m.n, m.tasks, {...o, _model: 'ручной режим'}); k++; }
      AI.save(); r.className = k ? 'ok small' : 'err small'; r.textContent = k ? `Принято черновиков: ${k}. Закройте окно — они в очереди «На проверку».` : 'Не найдено ни одной работы из запроса. Сначала нажмите «Скопировать запрос».'; if (k) $('#ai-mans').value = ''; }
    catch(e){ r.className = 'err small'; r.textContent = e.message; } };
}
function csv(){
  const R = rows(), head = ['ФИО', 'Группа', 'Почта', 'Последняя активность', 'Дней', 'Часов', 'Лекции открыто', 'Лекции изучено', C().prLabel, 'Попыток вставки', ...C().TESTS.map(t => t[1]), ...C().REPS.map(t => 'Отчёт ' + t[1])];
  const lines = [head, ...R.map(r => [r.fio, r.grp, r.email, dt(r.last_at), r.days, fmt(r.hours), r.lo, r.ld, r.pr, r.paste,
    ...TESTIDS_().map(id => { const b = best(r.user_id, 'test', id); return b ? b.best : ''; }),
    ...C().REPS.map(t => { const b = best(r.user_id, 'report', t[0]); return b ? (b.teacher_grade || 'сдан') : ''; })])];
  const txt = '﻿' + lines.map(l => l.map(v => { v = String(v ?? ''); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], {type:'text/csv;charset=utf-8'})); a.download = `${COURSES[COURSE].short}_${GRP || 'vse'}_${new Date().toISOString().slice(0, 10)}.csv`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
init();
</script>
